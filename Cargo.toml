[workspace]
resolver = "2"
members = [
  "crates/bitloom-hir",
  "crates/bitloom-builder",
  "crates/bitloom-macro",
  "crates/bitloom-prelude",
  "crates/bitloom-vlog",
  "crates/bitloom-sim",
  "crates/rhdl-firrtl",
  "crates/bitloom",
  "crates/rhdl-cabi",
  "crates/rhdl-hls",
  "crates/rhdl-formal",
  "crates/rhdl-float",
  "crates/rhdl-viz",
  "examples/counter_ports",
  "examples/wide_adder",
  "examples/fifo_skel",
  "examples/mixed_both",
  "examples/ip_box",
  "examples/rv32_feasibility",
  "examples/rv32_pipeline_feasibility",
  "examples/rv32_core",
  "examples/rv32_pipe",
]
default-members = [
  "crates/bitloom-hir",
  "crates/bitloom-builder",
  "crates/bitloom-macro",
  "crates/bitloom-prelude",
  "crates/bitloom-vlog",
  "crates/bitloom-sim",
  "crates/rhdl-firrtl",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
version = "0.1.2"

[workspace.dependencies]
bitloom-hir = { path = "crates/bitloom-hir", version = "0.1.2" }
bitloom-builder = { path = "crates/bitloom-builder", version = "0.1.2" }
bitloom-macro = { path = "crates/bitloom-macro", version = "0.1.2" }
bitloom-prelude = { path = "crates/bitloom-prelude", version = "0.1.2" }
bitloom-vlog = { path = "crates/bitloom-vlog", version = "0.1.2" }
bitloom-sim = { path = "crates/bitloom-sim", version = "0.1.2" }
rhdl-cabi = { path = "crates/rhdl-cabi" }
rhdl-hls = { path = "crates/rhdl-hls" }
rhdl-formal = { path = "crates/rhdl-formal" }
rhdl-float = { path = "crates/rhdl-float" }
rhdl-viz = { path = "crates/rhdl-viz" }
rhdl-firrtl = { path = "crates/rhdl-firrtl" }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
