name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Empty-dir ATDD + workspace tests: keep a stable wall-clock budget (Epic 13 retro).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - name: Install SystemC (FR101 LT smoke)
        run: sudo apt-get update && sudo apt-get install -y libsystemc-dev pkg-config g++ iverilog
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: Phase 24 scope and dependency gate
        run: python3 scripts/check_phase24_gate.py
      - name: test (MSRV 1.97.1)
        # Optimize long protocol matrices; test-profile assertions/overflow checks stay enabled.
        run: BITLOOM_REQUIRE_RTL=1 CARGO_PROFILE_TEST_OPT_LEVEL=1 cargo test --workspace
      - name: FR194 and FR195 documented prelude-only designs
        run: python3 scripts/check_fr194_example.py
      - name: FR196 documented prelude-only CSR design
        run: python3 scripts/check_fr196_example.py
      - name: FR196 documented prelude-only AXI-Lite and CSR composition
        run: python3 scripts/check_fr196_bridge_example.py
      - name: FR196 documented prelude-only four-window CSR composition
        run: python3 scripts/check_fr196_decoder_example.py
      - name: FR197 documented prelude-only Timer design and C header
        run: python3 _agile-output/test-artifacts/128-2-build-runner.py --only example --only header
      - name: FR197 documented prelude-only IRQ design and C header
        run: python3 _agile-output/test-artifacts/128-3-build-runner.py --only example --only header
      - name: FR197 documented prelude-only GPIO design and C header
        run: python3 _agile-output/test-artifacts/128-4-build-runner.py --only example --only header
      - name: FR197 documented prelude-only UART design and C header
        run: python3 _agile-output/test-artifacts/128-5-build-runner.py --only example --only header
      - name: Preserve Icarus failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rv-rtl-failure-evidence
          path: |
            target/fr195/
            target/fr195-fifo/
            target/fr196-csr/
            target/fr196-csr-c/
            target/fr197-timer/
            target/fr197-timer-api/
            target/fr197-irq/
            target/fr197-irq-api/
            target/fr197-irq-reruns/
            target/fr197-gpio/
            target/fr197-gpio-api/
            target/fr197-gpio-formal/
            target/fr197-gpio-reruns/
            target/fr197-uart/
            target/fr197-uart-api/
            target/fr197-uart-formal/
            target/fr197-uart-reruns/
            target/fr197-timer-reruns/
            target/fr196-axi-lite-csr/
            target/fr196-decoder-integration/

  # FR71 / NFR34 / FR28: required true Chisel JVM compile (Pattern A — parallel to Rust test).
  # Escape hatch env must never be enabled here. Do not use continue-on-error.
  # Wall-clock: timeout 20m until cold/hot samples are logged in docs/fr28-chisel-compilable.md
  # (epic-25-retro-item-56). Tighten after first push CI runs — do not guess downward.
  fr28-chisel-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Required Chisel 7.14.0 compile (golden fixture)
        # Same path as `just chisel-fr28-jvm` (required compile; no escape hatch).
        run: bash scripts/chisel-fr28-compile-required.sh crates/rhdl-firrtl/testdata/fr28_golden_counter.scala

  chisel-numeric:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Required numeric Scala/JVM and generated RTL execution
        run: |
          firtool_bin="$(cargo run -q -p bitloom -- firtool ensure | tail -n1)"
          export RHDL_FIRTOOL_PATH="$(dirname "$firtool_bin")"
          bash scripts/chisel-numeric-check.sh
          CARGO_PROFILE_TEST_OPT_LEVEL=1 cargo test --locked -p bitloom --test fr197_timer p1_timer_firrtl_chisel_same_independent_vectors -- --ignored --exact --nocapture
          CARGO_PROFILE_TEST_OPT_LEVEL=1 cargo test --locked -p bitloom --test fr197_timer_api p1_two_timer_firrtl_chisel_shared_and_renamed_definitions -- --ignored --exact --nocapture
          python3 _agile-output/test-artifacts/128-3-build-runner.py --only backends
          python3 _agile-output/test-artifacts/128-4-build-runner.py --only backends
          python3 _agile-output/test-artifacts/128-5-build-runner.py --only backends
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: chisel-numeric-failure
          path: |
            target/chisel-numeric/
            target/fr197-timer-backends/
            target/fr197-timer-api/
            target/fr197-irq/
            target/fr197-irq-api/
            target/fr197-irq-reruns/
            target/fr197-gpio/
            target/fr197-gpio-api/
            target/fr197-gpio-formal/
            target/fr197-gpio-reruns/
            target/fr197-uart/
            target/fr197-uart-api/
            target/fr197-uart-formal/
            target/fr197-uart-reruns/

  # FR35 / FR50: HLS product-path smoke. Failures are never ignored.
  # Default uses CI stub (wiring + synthesizable .v). Real Bambu 2024.10 via
  # BITLOOM_HLS_USE_REAL=1 + cached AppImage (see scripts/hls-smoke.sh / NFR14).
  hls-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: HLS smoke (Bambu 2024.10 pin / CI stub)
        run: bash scripts/hls-smoke.sh

  # FR127 / NFR54: required true SymbiYosys (sby) gate in default CI.
  # Reuses FR119 `just formal-sby-check` (≠ local-optional alone).
  # Failures are never ignored; missing tools must fail the job.
  formal-sby:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: FR161 formal-sby hygiene (pins)
        run: bash scripts/ci-sby-hygiene-check.sh
      - name: Install sby + yosys + z3 (FR127/FR161)
        run: bash scripts/ci-install-sby.sh
      - name: Required FR127 formal-sby-check
        # Same path as `just formal-sby-check` (FR119 script; required here for FR127).
        run: bash scripts/formal-sby-check.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Required FR119 real counterexample
        run: |
          command -v sby
          command -v yosys
          command -v z3
          cargo test -p bitloom --test fr119_symbiyosys_smt_path fr119_optional_real_sby_fail_fixture_when_installed -- --exact --nocapture
      - name: Required FR195 generated RTL safety and cover
        run: cargo test -p bitloom --test fr195_rv_reg_slice_formal -- --ignored --nocapture
      - name: Required FR195 parameter FIFO safety, cover and original RTL synthesis
        run: CARGO_PROFILE_TEST_OPT_LEVEL=1 cargo test -p bitloom --test fr195_param_sync_fifo_formal -- --ignored --nocapture
      - name: Required FR196 CSR safety, cover and original RTL synthesis
        run: CARGO_PROFILE_TEST_OPT_LEVEL=1 cargo test -p bitloom --test fr196_csr_formal -- --ignored --nocapture
      - name: Required FR196 AXI-Lite bridge safety, cover and registered boundaries
        run: CARGO_PROFILE_TEST_OPT_LEVEL=1 cargo test -p bitloom --test fr196_axi_lite_csr_formal -- --ignored --nocapture
      - name: Required FR196 decoder owner safety, cover, mutation and hierarchy synthesis
        run: CARGO_PROFILE_TEST_OPT_LEVEL=1 cargo test -p bitloom --test fr196_csr_decoder_formal -- --ignored --nocapture
      - name: Required FR197 Timer safety, independent cover and original synthesis
        run: |
          export BITLOOM_SBY_SOURCE="${RUNNER_TEMP:-/tmp}/bitloom-sby-src"
          python3 _agile-output/test-artifacts/128-2-build-runner.py --only formal
      - name: Required FR197 IRQ safety, cover, observer faults and original synthesis
        run: |
          export BITLOOM_SBY_SOURCE="${RUNNER_TEMP:-/tmp}/bitloom-sby-src"
          python3 _agile-output/test-artifacts/128-3-build-runner.py --only formal
      - name: Required IRQ evidence and isolated SBY harness regressions
        run: |
          export BITLOOM_SBY_SOURCE="${RUNNER_TEMP:-/tmp}/bitloom-sby-src"
          export PYTHONDONTWRITEBYTECODE=1
          python3 _agile-output/test-artifacts/128-3-build-harness-tests.py
          python3 -O _agile-output/test-artifacts/128-3-build-harness-tests.py
      - name: Required FR197 GPIO safety, cover, DUT faults and original synthesis
        run: |
          export BITLOOM_SBY_SOURCE="${RUNNER_TEMP:-/tmp}/bitloom-sby-src"
          python3 _agile-output/test-artifacts/128-4-build-runner.py --only formal
      - name: Required GPIO evidence and isolated SBY harness regressions
        run: |
          export BITLOOM_SBY_SOURCE="${RUNNER_TEMP:-/tmp}/bitloom-sby-src"
          export PYTHONDONTWRITEBYTECODE=1
          python3 _agile-output/test-artifacts/128-4-build-harness-tests.py
          python3 -O _agile-output/test-artifacts/128-4-build-harness-tests.py
      - name: Required UART safety, timing, cover and original synthesis
        run: |
          export BITLOOM_SBY_SOURCE="${RUNNER_TEMP:-/tmp}/bitloom-sby-src"
          python3 _agile-output/test-artifacts/128-5-build-runner.py --only formal
      - name: Required UART evidence harness regressions
        run: |
          export BITLOOM_SBY_SOURCE="${RUNNER_TEMP:-/tmp}/bitloom-sby-src"
          export PYTHONDONTWRITEBYTECODE=1
          python3 _agile-output/test-artifacts/128-5-build-harness-tests.py
          python3 -O _agile-output/test-artifacts/128-5-build-harness-tests.py
      - name: Preserve formal failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: formal-failure-evidence
          path: |
            target/fr195-formal/
            target/fr195-fifo-formal/
            target/fr196-csr-formal/
            target/fr196-bridge-formal/
            target/fr196-decoder-formal/
            target/fr197-timer-formal/
            target/fr197-irq-formal/
            target/fr197-irq-reruns/
            target/fr197-gpio/
            target/fr197-gpio-api/
            target/fr197-gpio-formal/
            target/fr197-gpio-reruns/
            target/fr197-uart/
            target/fr197-uart-api/
            target/fr197-uart-formal/
            target/fr197-uart-reruns/
            target/fr197-timer-reruns/
            target/fr196-decoder-integration/
            target/fr119/
            crates/rhdl-formal/fixtures/fr119/fr119_fail/

  # FR137 / NFR58: required external CIRCT compile gate (firtool-1.159.0 / AD-9).
  # Same path as `just circt-external-check`. Compile-gate MVP (sim deferred).
  # ≠ FR129 in-tree Handshake alone. Failures are never ignored; missing firtool fails the job.
  circt-external:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Ensure pinned firtool-1.159.0 (AD-9)
        run: cargo run -p bitloom -- firtool ensure
      - name: Install Icarus for bit-vector simulation regression
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Required native and emitted Rust, Verilog and FIRRTL bit-vector matrix
        run: |
          firtool_bin="$(cargo run -q -p bitloom -- firtool ensure)"
          export RHDL_FIRTOOL_PATH="$(dirname "$firtool_bin")"
          BITLOOM_REQUIRE_RTL=1 BITLOOM_REQUIRE_FIRRTL=1 cargo test -p bitloom --test simulator_bit_vectors -- --nocapture
      - name: Required FR137 circt-external-check
        run: bash scripts/circt-external-check.sh

  # FR164: required external CIRCT simulation gate (beyond FR137 compile-only).
  # Same path as `just circt-external-sim-check`. Failures are never ignored.
  circt-external-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Ensure pinned firtool-1.159.0 (AD-9)
        run: cargo run -p bitloom -- firtool ensure
      - name: Required FR164 circt-external-sim-check
        run: bash scripts/circt-external-sim-check.sh

  # FR169: required external CIRCT multi-lower / MLIR allocation gate (beyond FR164 sim).
  # Same path as `just circt-external-alloc-check`. Failures are never ignored.
  circt-external-alloc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Ensure pinned firtool-1.159.0 (AD-9)
        run: cargo run -p bitloom -- firtool ensure
      - name: Required FR169 circt-external-alloc-check
        run: bash scripts/circt-external-alloc-check.sh

  # FR175: required broader CIRCT SV / ir-verilog lower gate (beyond FR169).
  # Same path as `just circt-external-sv-check`. Failures are never ignored.
  circt-external-sv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Ensure pinned firtool-1.159.0 (AD-9)
        run: cargo run -p bitloom -- firtool ensure
      - name: Required FR175 circt-external-sv-check
        run: bash scripts/circt-external-sv-check.sh

  # FR170: required Chisel update-mainline / HEAD Parser migration gate (beyond FR138).
  # Same path as `just parser-head-migration-check`. Failures are never ignored.
  parser-head-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Ensure pinned firtool-1.159.0 (AD-9)
        run: cargo run -p bitloom -- firtool ensure
      - name: Required FR170 parser-head-migration-check
        run: bash scripts/parser-head-migration-check.sh

  # FR176: required combined Style Guide + update-mainline ecosystem deepen (beyond FR165/FR170 alone).
  # Same path as `just chisel-ecosystem-deepen-check`. Failures are never ignored.
  chisel-ecosystem-deepen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Ensure pinned firtool-1.159.0 (AD-9)
        run: cargo run -p bitloom -- firtool ensure
      - name: Required FR176 chisel-ecosystem-deepen-check
        run: bash scripts/chisel-ecosystem-deepen-check.sh

  # FR181: required Style Guide / linter deepen beyond FR176.
  # Same path as `just chisel-style-linter-deepen-check`. Failures are never ignored.
  chisel-style-linter-deepen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Ensure pinned firtool-1.159.0 (AD-9)
        run: cargo run -p bitloom -- firtool ensure
      - name: Required FR181 chisel-style-linter-deepen-check
        run: bash scripts/chisel-style-linter-deepen-check.sh

  # FR188: required community Style Guide pack beyond FR181.
  # Same path as `just chisel-style-guide-pack-check`. Failures are never ignored.
  chisel-style-guide-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Ensure pinned firtool-1.159.0 (AD-9)
        run: cargo run -p bitloom -- firtool ensure
      - name: Required FR188 chisel-style-guide-pack-check
        run: bash scripts/chisel-style-guide-pack-check.sh

  # FR174: required unpaired CIRCT/firtool document-pinned mainline gate (≠ AD-9 product; ≠ FR170 alone).
  # Same path as `just circt-unpaired-head-check`. Failures are never ignored.
  circt-unpaired-head:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Required FR174 circt-unpaired-head-check
        run: bash scripts/circt-unpaired-head-check.sh

  # FR179: required floating CIRCT HEAD track gate (≠ AD-9 product; ≠ FR174 1.156.0 alone).
  # Same path as `just circt-floating-git-head-check`. Failures are never ignored.
  circt-floating-git-head:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Required FR179 circt-floating-git-head-check
        run: bash scripts/circt-floating-git-head-check.sh

  # FR186: required unbounded / live CIRCT tip gate (≠ AD-9 product; ≠ FR179 floating-head alone).
  # Same path as `just circt-live-tip-check`. Failures are never ignored.
  circt-live-tip:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Required FR186 circt-live-tip-check
        run: bash scripts/circt-live-tip-check.sh

  # FR144 / NFR62: required surface-crate SemVer gate (cargo-semver-checks).
  # Same path as `just semver-check`. Failures are never ignored; missing tool fails the job.
  semver-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Install cargo-semver-checks (FR144)
        run: cargo install cargo-semver-checks --locked
      - name: SemVer script package coverage and failure propagation
        run: bash scripts/test-semver-check.sh
      - name: Required FR144 semver-check
        run: bash scripts/semver-check.sh
