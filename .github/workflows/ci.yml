name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Empty-dir ATDD + workspace tests: keep a stable wall-clock budget (Epic 13 retro).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: test (MSRV 1.97.1)
        run: cargo test --workspace
