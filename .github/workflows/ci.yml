name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Empty-dir ATDD + workspace tests: keep a stable wall-clock budget (Epic 13 retro).
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
          components: rustfmt
      - name: Install SystemC (FR101 LT smoke)
        run: sudo apt-get update && sudo apt-get install -y libsystemc-dev pkg-config g++
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: test (MSRV 1.97.1)
        run: cargo test --workspace

  # FR71 / NFR34 / FR28: required true Chisel JVM compile (Pattern A — parallel to Rust test).
  # Escape hatch env must never be enabled here. Do not use continue-on-error.
  # Wall-clock: timeout 20m until cold/hot samples are logged in docs/fr28-chisel-compilable.md
  # (epic-25-retro-item-56). Tighten after first push CI runs — do not guess downward.
  fr28-chisel-jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Required Chisel 7.14.0 compile (golden fixture)
        # Same path as `just chisel-fr28-jvm` (required compile; no escape hatch).
        run: bash scripts/chisel-fr28-compile-required.sh crates/rhdl-firrtl/testdata/fr28_golden_counter.scala

  # FR35 / FR50: HLS product-path smoke. Failures are never ignored.
  # Default uses CI stub (wiring + synthesizable .v). Real Bambu 2024.10 via
  # BITLOOM_HLS_USE_REAL=1 + cached AppImage (see scripts/hls-smoke.sh / NFR14).
  hls-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: HLS smoke (Bambu 2024.10 pin / CI stub)
        run: bash scripts/hls-smoke.sh

  # FR127 / NFR54: required true SymbiYosys (sby) gate in default CI.
  # Reuses FR119 `just formal-sby-check` (≠ local-optional alone).
  # Failures are never ignored; missing tools must fail the job.
  formal-sby:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: FR161 formal-sby hygiene (pins)
        run: bash scripts/ci-sby-hygiene-check.sh
      - name: Install sby + yosys + z3 (FR127/FR161)
        run: bash scripts/ci-install-sby.sh
      - name: Required FR127 formal-sby-check
        # Same path as `just formal-sby-check` (FR119 script; required here for FR127).
        run: bash scripts/formal-sby-check.sh

  # FR137 / NFR58: required external CIRCT compile gate (firtool-1.158.0 / AD-9).
  # Same path as `just circt-external-check`. Compile-gate MVP (sim deferred).
  # ≠ FR129 in-tree Handshake alone. Failures are never ignored; missing firtool fails the job.
  circt-external:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Ensure pinned firtool-1.158.0 (AD-9)
        run: cargo run -p bitloom -- firtool ensure
      - name: Required FR137 circt-external-check
        run: bash scripts/circt-external-check.sh

  # FR164: required external CIRCT simulation gate (beyond FR137 compile-only).
  # Same path as `just circt-external-sim-check`. Failures are never ignored.
  circt-external-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Ensure pinned firtool-1.158.0 (AD-9)
        run: cargo run -p bitloom -- firtool ensure
      - name: Required FR164 circt-external-sim-check
        run: bash scripts/circt-external-sim-check.sh

  # FR169: required external CIRCT multi-lower / MLIR allocation gate (beyond FR164 sim).
  # Same path as `just circt-external-alloc-check`. Failures are never ignored.
  circt-external-alloc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Ensure pinned firtool-1.158.0 (AD-9)
        run: cargo run -p bitloom -- firtool ensure
      - name: Required FR169 circt-external-alloc-check
        run: bash scripts/circt-external-alloc-check.sh

  # FR175: required broader CIRCT SV / ir-verilog lower gate (beyond FR169).
  # Same path as `just circt-external-sv-check`. Failures are never ignored.
  circt-external-sv:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Ensure pinned firtool-1.158.0 (AD-9)
        run: cargo run -p bitloom -- firtool ensure
      - name: Required FR175 circt-external-sv-check
        run: bash scripts/circt-external-sv-check.sh

  # FR170: required Chisel update-mainline / HEAD Parser migration gate (beyond FR138).
  # Same path as `just parser-head-migration-check`. Failures are never ignored.
  parser-head-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Ensure pinned firtool-1.158.0 (AD-9)
        run: cargo run -p bitloom -- firtool ensure
      - name: Required FR170 parser-head-migration-check
        run: bash scripts/parser-head-migration-check.sh

  # FR174: required unpaired CIRCT/firtool document-pinned mainline gate (≠ AD-9 product; ≠ FR170 alone).
  # Same path as `just circt-unpaired-head-check`. Failures are never ignored.
  circt-unpaired-head:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Required FR174 circt-unpaired-head-check
        run: bash scripts/circt-unpaired-head-check.sh

  # FR144 / NFR62: required surface-crate SemVer gate (cargo-semver-checks).
  # Same path as `just semver-check`. Failures are never ignored; missing tool fails the job.
  semver-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Install cargo-semver-checks (FR144)
        run: cargo install cargo-semver-checks --locked
      - name: Required FR144 semver-check
        run: bash scripts/semver-check.sh
