# release-plz — Bitloom subsequent publishes via Trusted Publishing (OIDC)
#
# crates.io Trusted Publishing is configured for TangCan/bitloom → this workflow.
# No long-lived CARGO_REGISTRY_TOKEN required for OIDC publishes.

name: release-plz

on:
  workflow_dispatch:
    inputs:
      command:
        description: "选择仅准备发布 PR 或实际发布 crates.io 版本"
        type: choice
        required: true
        default: release-pr
        options:
          - release-pr
          - release
  push:
    branches: [main, master]

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Publish contract present
        run: |
          test -f docs/crates-io-publish-bitloom.md
          test -f docs/semver-0x-policy.md
          grep -q 'repository = "https://github.com/TangCan/bitloom"' crates/bitloom/Cargo.toml

  release-plz-release:
    needs: readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.1"
      - name: Run release-plz
        uses: MarcoIeni/release-plz-action@v0.5
        with:
          command: ${{ github.event_name == 'workflow_dispatch' && inputs.command || 'release-pr' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted Publishing: omit CARGO_REGISTRY_TOKEN; use `release` command
          # when you want direct publish instead of opening a PR.
